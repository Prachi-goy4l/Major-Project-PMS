<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Members - Project Management System</title>

    <link rel="stylesheet" href="../CSS/team.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="app-container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo-area">

                <div class="logo">
                    <i class="fa-solid fa-layer-group"></i>
                </div>

                <div class="logo-text">
                    <span>Project</span>
                    <span>Management</span>
                    <span>System</span>
                </div>

            </div>


            <nav class="sidebar-nav">

                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a href="projects.html">
                    <i class="fa-solid fa-folder"></i>
                    <span>Projects</span>
                </a>

                <a href="tasks.html">
                    <i class="fa-solid fa-square-check"></i>
                    <span>Tasks</span>
                </a>

                <a href="team.html" class="active">
                    <i class="fa-solid fa-users"></i>
                    <span>Team</span>
                </a>

                <a href="calendar.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Calendar</span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>

            </div>


            <div class="sidebar-footer">

                <div class="plant">
                    <i class="fa-solid fa-seedling"></i>
                </div>

                <div class="footer-links">
                    <span>Plan</span>
                    <span>|</span>
                    <span>Organize</span>
                    <span>|</span>
                    <span>Achieve</span>
                </div>

            </div>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search projects, tasks, or team members...">

                </div>


                <div class="topbar-right">

                    <div class="notification">

                        <i class="fa-regular fa-bell"></i>

                        <span>3</span>

                    </div>


                    <div class="profile">

                        <div class="profile-avatar">
                            A
                        </div>

                        <span>Admin</span>

                        <i class="fa-solid fa-chevron-down"></i>

                    </div>

                </div>

            </header>


            <!-- ================= PAGE ================= -->

            <section class="page-content">


                <!-- PAGE HEADING -->

                <div class="page-heading">

                    <div class="heading-left">

                        <div class="heading-icon">
                            <i class="fa-solid fa-users"></i>
                        </div>

                        <div>

                            <h1>Team Members</h1>

                            <p>
                                Manage team members and view their project assignments.
                            </p>

                        </div>

                    </div>


                    <button
                        type="button"
                        id="addTeamMemberBtn"
                        class="add-team-btn">

                        <i class="fa-solid fa-plus"></i>

                        Add Team Member

                    </button>

                </div>


                <!-- ================= ADD MEMBER FORM ================= -->

                <div
                    class="form-box"
                    id="memberFormBox">

                    <div class="form-title">

                        <div>

                            <h3>Add Team Member</h3>

                            <p>
                                Add a member to an existing project.
                            </p>

                        </div>

                        <button
                            type="button"
                            id="closeFormBtn"
                            class="close-form">

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>


                    <form id="teamForm">

                        <div class="form-field">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter full name"
                                required>

                        </div>


                        <div class="form-field">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter email address"
                                required>

                        </div>


                        <div class="form-field">

                            <label for="department">
                                Department
                            </label>

                            <input
                                type="text"
                                id="department"
                                placeholder="Enter department"
                                required>

                        </div>


                        <div class="form-field">

                            <label for="projectName">
                                Project Name
                            </label>

                            <input
                                type="text"
                                id="projectName"
                                list="projectList"
                                placeholder="Select or enter project name"
                                required>

                            <datalist id="projectList"></datalist>

                        </div>


                        <div class="form-field">

                            <label for="role">
                                Role in Project
                            </label>

                            <input
                                type="text"
                                id="role"
                                placeholder="e.g. Developer"
                                required>

                        </div>


                        <div class="form-buttons">

                            <button
                                type="button"
                                id="cancelBtn"
                                class="cancel-btn">

                                Cancel

                            </button>

                            <button
                                type="submit"
                                class="save-member-btn">

                                <i class="fa-solid fa-user-plus"></i>

                                Add Member

                            </button>

                        </div>

                    </form>

                </div>


                <!-- ================= MAIN TEAM AREA ================= -->

                <div class="team-layout">


                    <!-- ================= PROJECTS ================= -->

                    <div class="projects-panel">

                        <div class="panel-heading">

                            <h2>Projects</h2>

                            <p>
                                Click on a project to view its team members.
                            </p>

                        </div>


                        <div
                            id="projectsList"
                            class="projects-list">

                            <!-- Projects generated dynamically -->

                        </div>

                    </div>


                    <!-- ================= MEMBERS ================= -->

                    <div class="members-panel">

                        <div id="projectDetails">

                            <!-- Project details generated dynamically -->

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="../JAVASCRIPT/team.js"></script>

</body>

</html>
