<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Management</title>

  <!-- css -->
    <link rel="stylesheet" href="../CSS/projects.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/layout.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="container">
        <section class="projects-page" aria-labelledby="projects-title">
            <header class="projects-heading">
                <div class="projects-heading-copy">
                    <span class="projects-heading-icon" aria-hidden="true">
                        <i class="fa-solid fa-folder-open"></i>
                    </span>
                    <div>
                        <h1 id="projects-title">Projects</h1>
                        <p>Manage and track all your projects in one place.</p>
                    </div>
                </div>
                <button class="add-project-btn" id="openProjectModal" type="button">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    New Project
                </button>
            </header>

            <section class="projects-toolbar" aria-label="Project filters">
                <div class="project-filters" role="group" aria-label="Filter projects by status">
                    <button class="project-filter active" type="button" data-status="all" aria-pressed="true">
                        All Projects <span id="allProjectCount">0</span>
                    </button>
                    <button class="project-filter" type="button" data-status="In Progress" aria-pressed="false">In Progress</button>
                    <button class="project-filter" type="button" data-status="Not Started" aria-pressed="false">Not Started</button>
                    <button class="project-filter" type="button" data-status="Completed" aria-pressed="false">Completed</button>
                </div>
                <label class="project-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="projectSearch" type="search" placeholder="Search projects..." autocomplete="off">
                </label>
            </section>

            <section class="project-grid" id="projectGrid" aria-label="Projects" aria-live="polite"></section>
        </section>
    </main>


    <!-- ========================= -->
    <!-- ADD PROJECT POPUP -->
    <!-- ========================= -->

    <div class="modal" id="projectModal">

        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">

                <h2 id="projectModalTitle">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Add New Project
                </h2>

                <button class="close-btn" id="closeProjectModal" type="button" aria-label="Close dialog">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>

            </div>


            <!-- Project Form -->
            <form id="projectForm">

                <div class="form-group">

                    <label for="projectName">
                        Project Name
                    </label>

                    <input
                        type="text"
                        id="projectName"
                        placeholder="Enter project name"
                        required>

                </div>


                <div class="form-group">

                    <label for="members">
                        Assigned Members
                    </label>

                    <input
                        type="text"
                        id="members"
                        placeholder="Enter member names">

                </div>


                <div class="form-group full-width">

                    <label for="description">
                        Project Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter project description"
                        required></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="startDate">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="startDate"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status" required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Not Started">
                            Not Started
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <button type="submit" class="submit-project-btn">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span>Add Project</span>
                </button>

            </form>

        </div>

    </div>


   

    <script src="../JAVASCRIPT/layout.js"></script>
    <script>initLayout("projects");</script>
    <script src="../JAVASCRIPT/projects.js"></script>

</body>
</html>
